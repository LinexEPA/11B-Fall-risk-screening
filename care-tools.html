<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11B｜臨床照護工具</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#2b4053;background:#fafaf8}*{box-sizing:border-box}body{margin:0}header{padding:38px max(18px,calc((100% - 860px)/2));background:linear-gradient(110deg,#e9f1f9,#f8eceb,#fff6e8)}h1{font-size:clamp(26px,5vw,35px);margin:8px 0}h2{font-size:21px}p{line-height:1.7;color:#64798b}main{max-width:860px;margin:25px auto 60px;padding:0 18px}a{color:#416b92}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.nav button{border:1px solid #e1e7ec;background:white;border-radius:13px;padding:16px 9px;color:#47657e;font-size:17px;font-weight:600;cursor:pointer}.nav button[aria-pressed=true]{background:#e4eef8;border-color:#9ab8d3;color:#2e5578}.panel{margin-top:18px;background:#fff;border:1px solid #e6e9eb;border-radius:17px;padding:23px}.muted{font-size:13px;color:#7d8b99}.note{background:#fff5e6;padding:13px;border-radius:11px;color:#826b49;font-size:13px;line-height:1.7}.meal{border:1px solid #e5ebef;border-radius:14px;margin:13px 0;padding:17px}.meal summary{cursor:pointer;font-weight:700;font-size:18px}.meal[open]{background:#fbfdff}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}.choices label{display:inline-flex;gap:7px;align-items:center;border:1px solid #dce6ee;border-radius:10px;padding:10px 12px;background:white;cursor:pointer}.choices input{accent-color:#547da5;width:17px;height:17px}.group{font-weight:650;margin:16px 0 6px}textarea,input[type=text]{font:inherit;border:1px solid #d6dfe6;border-radius:9px;padding:11px;width:100%}textarea{min-height:80px}button.action{background:#4d7296;border:0;border-radius:10px;padding:12px 18px;color:white;font:inherit;cursor:pointer}button.alt{background:#edf2f7;color:#3c617f;margin-left:7px}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.8;background:#f5f8fb;border-radius:12px;padding:16px}.hidden{display:none}footer{text-align:center;color:#8896a4;font-size:12px;margin-top:35px}
</style></head><body><header><a href="./">← 返回首頁</a><div class="muted" style="letter-spacing:.14em;margin-top:16px">11B · CARE TOOLS</div><h1>臨床照護工具</h1><p style="margin:0">日常紀錄與訓練，從這裡進入。</p></header><main>
<div class="note"><strong>V3.0 操作測試</strong>：目前未串接原本的 Google 試算表，不會儲存紀錄。請使用虛構情境，勿輸入真實病人資料。</div>
<nav class="nav" aria-label="臨床照護工具" style="margin-top:20px">
<button type="button" data-tab="wound">傷口</button><button type="button" data-tab="suction">抽痰</button><button type="button" data-tab="swallow">吞嚥訓練</button><button type="button" data-tab="privacy">保密</button><button type="button" data-tab="beds">床號</button></nav>
<section class="panel" id="placeholder"><h2 id="placeholderTitle">臨床照護工具</h2><p>請從上方選擇要進入的功能。</p></section>
<section class="panel hidden" id="swallowPanel"><h2>吞嚥訓練</h2><p>有訓練才勾選；沒有訓練的餐次可以完全不填。每個餐次的主食、材質、食用量都可複選。</p>
<div style="background:#edf5fa;border-radius:12px;padding:14px;margin:14px 0"><strong>ST 回饋入口</strong><p style="margin:7px 0">語言治療師可快速回饋目前進食限制、IDDSI 質地與訂餐需求。</p><a href="./st-feedback.html">開啟 ST 回饋表單（測試版） →</a></div><div style="padding:10px 0"><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="stOnly" style="width:18px;height:18px">僅在 ST 訓練時進食</label></div><div id="meals"></div><div class="group">其他觀察或補充（選填）</div><textarea id="remarks" placeholder="自由輸入需要交接的觀察或補充內容"></textarea><div style="margin-top:16px"><button type="button" class="action" id="preview">產生摘要</button><button type="button" class="action alt" id="clear">清除勾選</button></div><div id="result" class="hidden"><h3>訓練摘要（可複製）</h3><pre id="summary"></pre><button type="button" class="action" id="copy">複製摘要</button></div></section>
<footer>11B · 臨床照護與交接日常</footer></main>
<script>
'use strict';
const names=['早餐','午餐','晚餐'];
const categories=[['主食',['稀飯攪打','稀飯','白飯']],['材質',['菜泥','碎菜','軟質']],['量',['1/3','1/2','2/3','完整盤餐']]];
const meals=document.getElementById('meals');
function make(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
for(const meal of names){const details=make('details',undefined,'meal');details.dataset.meal=meal;const summary=make('summary',meal+'　·　有訓練再展開勾選');details.append(summary);for(const [category,options] of categories){details.append(make('div',category,'group'));const wrap=make('div',undefined,'choices');for(const option of options){const label=make('label');const input=make('input');input.type='checkbox';input.dataset.category=category;input.value=option;label.append(input,document.createTextNode(option));wrap.append(label);}details.append(wrap);}meals.append(details);}
const placeholder=document.getElementById('placeholder'),panel=document.getElementById('swallowPanel');
const titles={wound:'傷口',suction:'抽痰',privacy:'保密',beds:'床號'};
document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{const tab=btn.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));panel.classList.toggle('hidden',tab!=='swallow');placeholder.classList.toggle('hidden',tab==='swallow');if(tab!=='swallow'){placeholder.replaceChildren(make('h2',titles[tab]),make('p','此項保留原本的既有功能，待確認原工具網址後串接；目前不新增其他操作。'));}}));
document.querySelector('[data-tab=swallow]').click();
function getSummary(){const lines=[];if(document.getElementById('stOnly').checked)lines.push('進食限制：僅在 ST 訓練時進食');for(const d of document.querySelectorAll('.meal')){const parts=[];for(const [category] of categories){const checked=[...d.querySelectorAll('input:checked')].filter(x=>x.dataset.category===category).map(x=>x.value);if(checked.length)parts.push(category+'：'+checked.join('、'));}if(parts.length)lines.push(d.dataset.meal+'｜'+parts.join('；'));}const remarks=document.getElementById('remarks').value.trim();if(remarks)lines.push('其他觀察：'+remarks);return lines.length?'吞嚥訓練紀錄\n'+lines.join('\n'):'尚未勾選任何訓練內容。';}
document.getElementById('preview').onclick=()=>{document.getElementById('summary').textContent=getSummary();document.getElementById('result').classList.remove('hidden');};
document.getElementById('clear').onclick=()=>{document.querySelectorAll('.meal input').forEach(x=>x.checked=false);document.getElementById('stOnly').checked=false;document.getElementById('remarks').value='';document.getElementById('result').classList.add('hidden');};
document.getElementById('copy').onclick=async()=>{const s=getSummary();try{await navigator.clipboard.writeText(s);alert('已複製摘要');}catch(e){alert('無法自動複製，請選取摘要文字複製。');}};
</script></body></html>
