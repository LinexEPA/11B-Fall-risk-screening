<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11B｜臨床照護工具</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#2d4154;background:#fafaf8}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:48px auto;padding:0 20px}a{color:#47749b}h1{font-size:clamp(25px,5vw,35px);margin:10px 0}p{line-height:1.8;color:#697e90}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:25px}.tile{background:white;border:1px solid #e5e9eb;border-radius:16px;padding:22px;min-height:130px}.tile strong{font-size:19px}.tile span{display:block;color:#8998a5;font-size:13px;margin-top:14px}.notice{background:#edf3f7;border-radius:12px;padding:17px;margin-top:25px;font-size:14px;line-height:1.8}</style></head><body><main><a href="./">← 返回首頁</a><p style="letter-spacing:.12em;font-size:12px">11B · CLINICAL CARE TOOLS</p><h1>臨床照護工具</h1><p>將單位原本正在使用的工具集中在這裡，不改動原有系統。</p><div class="grid"><div class="tile"><strong>傷口</strong><span>待連結既有工具</span></div><div class="tile"><strong>抽痰</strong><span>待連結既有工具</span></div><div class="tile"><strong>吞嚥訓練</strong><span>待連結既有工具</span></div><div class="tile"><strong>保密</strong><span>待確認既有功能名稱及連結</span></div><div class="tile"><strong>床號</strong><span>待確認既有功能名稱及連結</span></div></div><div class="notice">目前僅建立導覽位置，沒有連接或複製任何原有工具，也不會存取臨床資料。待確認既有工具網址後再逐一串接。</div></main></body></html>
