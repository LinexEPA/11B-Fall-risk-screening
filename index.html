<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11B｜每日照護交接 V3.0</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#23344b;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{background:#e6eef9;padding:26px max(18px,calc((100% - 850px)/2))}h1{margin:4px 0;font-size:26px}h2{font-size:19px}main{max-width:850px;margin:24px auto;padding:0 16px}.muted,small{color:#63738b}.panel{background:white;border:1px solid #e3e9f0;border-radius:15px;padding:22px;margin-bottom:18px}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd6e2;border-radius:9px;font:inherit}textarea{min-height:95px}button{border:0;border-radius:9px;padding:11px 17px;background:#315c91;color:white;font:inherit;cursor:pointer;margin:7px 6px 0 0}button.secondary{background:#e7edf6;color:#294568}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.item{padding:17px 0;border-top:1px solid #e6edf5}.tag{display:inline-block;background:#edf2f8;padding:4px 10px;border-radius:20px;font-size:13px}.notice{background:#fff6e8;padding:12px;border-radius:9px}.history{font-size:14px;line-height:1.8;color:#44566d}.hide{display:none}summary{cursor:pointer;font-weight:600}
</style></head><body><header><small>11B · 護理交接</small><h1>每日照護交接 V3.0</h1><div class="muted">新入院名單・今日特殊事項・跨班追蹤</div></header>
<main><div class="panel notice"><strong>目前為示範測試版</strong><div>尚未連接 Google 試算表。請只輸入虛構內容，不要填寫病人資料、姓名或可識別資訊。</div></div>
<details class="panel"><summary>使用說明（支援人力可點開）</summary><p>白班｜當班 Leader：輸入新入院床號、建立特殊事項。</p><p>小夜／大夜｜當班 Leader：選擇「無變化，持續追蹤」或「有變化」，有變化才填寫內容。</p><p>穩定時可結案，須填結案人。大夜另核對新病人評估。</p></details>
<section class="panel"><h2>今日新入院名單</h2><label for="beds">床號（每行一床）</label><textarea id="beds" placeholder="例如：2171-1"></textarea><button onclick="alert('示範版不會寫入資料；後續串接 GAS 後才啟用儲存。')">確認名單（示範）</button></section>
<section class="panel"><h2>白班｜當班 Leader 建立特殊事項</h2><label for="topic">事項簡述</label><input id="topic" placeholder="例如：照護安排需跨班追蹤"><label for="detail">今日特殊狀態（自由輸入）</label><textarea id="detail" placeholder="描述客觀情況、已採取措施、下一班需要留意的事"></textarea><label for="author">建立人員</label><input id="author" placeholder="當班 Leader 姓名"><button onclick="addItem()">新增特殊事項</button></section>
<section class="panel"><h2>特殊事項追蹤</h2><div id="items"><p class="muted">目前沒有事項。請先在上方新增示範事項。</p></div></section>
</main>
<script>
const items=[];const el=id=>document.getElementById(id);
function addItem(){const topic=el('topic').value.trim(),detail=el('detail').value.trim(),author=el('author').value.trim();if(!topic||!detail||!author){alert('請填寫事項、內容及建立人員');return;}items.unshift({topic,detail,author,closed:false,logs:[]});['topic','detail'].forEach(x=>el(x).value='');render();}
function updateItem(i){const shift=el('shift'+i).value,mode=el('mode'+i).value,note=el('note'+i).value.trim(),name=el('name'+i).value.trim();if(!name){alert('請填寫當班 Leader 姓名');return;}if(mode==='changed'&&!note){alert('有變化時請填寫變化內容');return;}if(mode==='close'&&!note){alert('結案請簡述穩定情形');return;}const item=items[i];item.logs.push({shift,mode,note,name,time:new Date().toLocaleString('zh-TW')});if(mode==='close')item.closed=true;render();}
function render(){el('items').replaceChildren();if(!items.length){el('items').textContent='目前沒有事項';return;}items.forEach((it,i)=>{const box=document.createElement('div');box.className='item';const h=document.createElement('h3');h.textContent=it.topic;box.append(h);const d=document.createElement('p');d.textContent=it.detail;box.append(d);const meta=document.createElement('small');meta.textContent='白班建立：'+it.author+'｜'+(it.closed?'已穩定結案':'持續追蹤');box.append(meta);const log=document.createElement('div');log.className='history';it.logs.forEach(x=>{const p=document.createElement('p');p.textContent=x.time+'｜'+x.shift+'｜'+x.name+'｜'+(x.mode==='same'?'無變化，持續追蹤':x.mode==='changed'?'有變化':'穩定結案')+(x.note?'：'+x.note:'');log.append(p);});box.append(log);
if(!it.closed){const wrap=document.createElement('div');wrap.innerHTML='<div class="row"><div><label>班別</label><select id="shift'+i+'"><option>小夜｜當班 Leader</option><option>大夜｜當班 Leader</option></select></div><div><label>追蹤結果</label><select id="mode'+i+'"><option value="same">無變化，持續追蹤</option><option value="changed">有變化</option><option value="close">穩定結案</option></select></div></div><label>變化／結案說明（無變化可留空）</label><textarea id="note'+i+'" placeholder="有變化或結案時填寫"></textarea><label>當班 Leader 姓名／結案人</label><input id="name'+i+'" placeholder="姓名"><button id="save'+i+'">記錄本班結果</button>';box.append(wrap);wrap.querySelector('button').addEventListener('click',()=>updateItem(i));}el('items').append(box);});}
</script></body></html>
